{% extends 'base.html' %}
{% load static %}


{% block base %}
<div class="w-full min-h-screen overflow-auto flex justify-center items-center py-8 px-4 sm:px-0 sm:py-16 bg-background">
    <div class="max-w-md w-full grid gap-8">
        <div class="flex justify-center">
            <a href="{% url 'main:home' %}" class="flex items-center space-x-3 rtl:space-x-reverse font-poppins border border-transparent focus:border focus:border-dashed focus:border-primary">
                <img src="{% static 'images/icon.png' %}" class="h-10" alt="Flowbite Logo" />
                <h1 class="
                    relative text-3xl font-black whitespace-nowrap
                    after:content-['baldyrgan'] after:absolute after:start-0 after:-bottom-2 after:text-xs after:text-subtle after:font-normal
                    "
                >
                    ROBO
                </h1>
            </a>
        </div>

        <div class="relative">
            {% block auth_layout %}
            {% endblock auth_layout %}
        </div>
    </div>
</div>
{% endblock base %}
